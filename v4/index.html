<!DOCTYPE html>
<html lang="no" data-theme="standard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ukeplan1e</title>
<link rel="icon" id="favicon" href="unoicon.png">
<link rel="stylesheet" href="style.css?v=20260607e">
</head>
<body>

<!-- ── Lastelinje ───────────────────────────────────────────────── -->
<div id="lastelinje"></div>

<!-- ── Lagre-overlay ────────────────────────────────────────────── -->
<div id="lagre-overlay" class="lagre-overlay skjult" role="dialog" aria-modal="true" aria-label="Lagrer...">
  <div class="overlay-boks">
    <div class="spinner" id="overlay-spinner"></div>
    <div class="overlay-ok skjult" id="overlay-ok">✅</div>
    <div class="overlay-tekst" id="overlay-tekst">Sender tanker til skyene…</div>
    <button type="button" class="btn btn-p skjult" id="overlay-retry">Prøv igjen</button>
  </div>
</div>

<!-- ── Header ───────────────────────────────────────────────────── -->
<header id="app-header">
  <a href="#/" id="hdr-home-link" class="hdr-home-link">
    <img id="hdr-logo" src="" alt="Logo" class="skjult">
    <div>
      <div class="skole-navn" id="hdr-skolenavn">Ukeplan1e</div>
      <div class="skole-klasse skjult" id="hdr-klasse"></div>
    </div>
  </a>
  <span class="spacer"></span>

  <!-- PC-knapper (skjules på mobil) -->
  <span id="hdr-username" class="hdr-pc-only hdr-username"></span>
  <button type="button" class="hdr-btn skjult hdr-pc-only" id="hdr-admin-toggle">Admin</button>
  <button type="button" class="hdr-btn skjult hdr-pc-only" id="hdr-laerer-btn">Lærervisning</button>
  <button type="button" class="hdr-btn skjult hdr-pc-only" id="hdr-logout-btn">Logg ut</button>
  <button type="button" class="hdr-btn hdr-pc-only" id="hdr-login-btn">Logg inn</button>

  <!-- Hamburger (vises bare på mobil) -->
  <button type="button" class="hdr-btn hdr-hamburger skjult" id="hdr-hamburger" aria-label="Meny">☰</button>
  <div class="hdr-dropdown skjult" id="hdr-dropdown">
    <span class="hdr-dropdown-navn skjult" id="hdr-dropdown-navn"></span>
    <button type="button" class="hdr-dropdown-btn skjult" id="hdr-dd-admin">Admin</button>
    <button type="button" class="hdr-dropdown-btn skjult" id="hdr-dd-laerer">Lærervisning</button>
    <button type="button" class="hdr-dropdown-btn skjult" id="hdr-dd-logout">Logg ut</button>
    <button type="button" class="hdr-dropdown-btn" id="hdr-dd-login">Logg inn</button>
  </div>
</header>

<!-- ── Utskrift-hode (synlig bare ved print) ────────────────────── -->
<div class="utskrift-hode" id="utskrift-hode"></div>

<!-- ── Hoved-innhold ────────────────────────────────────────────── -->
<main id="app-main">
  <!-- Fylles av router/views i app.js -->
  <div class="tom-uke laster-start">Laster…</div>
</main>

<!-- ── Modal-container ──────────────────────────────────────────── -->
<div id="modal-container"></div>

<!-- ── Footer ───────────────────────────────────────────────────── -->
<footer></footer>

<!-- ── Supabase CDN ──────────────────────────────────────────────── -->
<!-- defer: bevarer rekkefølge og kjører etter at DOM er parset -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- ── App ──────────────────────────────────────────────────────── -->
<script defer src="app.js?v=20260607e"></script>

<!-- ── Footer-script ────────────────────────────────────────────── -->
<script defer src="uno-footer.js"></script>

</body>
</html>
