name: Supabase keep-alive

# Kjøres hver 5. dag kl. 06:00 UTC – hindrer Supabase fra å pause ved inaktivitet
on:
  schedule:
    - cron: '0 6 */5 * *'
  workflow_dispatch:  # Kan også kjøres manuelt fra GitHub Actions-siden

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/schools?select=id&limit=1")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -gt 299 ]; then
            echo "❌ Ping feilet med status $STATUS"
            exit 1
          fi
          echo "✅ Supabase er våken"
